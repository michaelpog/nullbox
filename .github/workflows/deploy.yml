# Tests every push and pull request; on main (or by hand from the Actions tab) it also
# builds the two Docker images, copies them to the server over SSH and restarts the app.
#
# Needs, under Settings -> Secrets and variables -> Actions:
#   Secrets:   DEPLOYMENT_KEY    the PRIVATE SSH key (begins "-----BEGIN OPENSSH PRIVATE KEY-----")
#              ADMIN_TOKEN   a new long random value for GET /api/admin/export
#   Variables: DEPLOY_USER   optional, defaults to deploy (from the organizers' setup script)
#              DEPLOY_HOST   optional, defaults to team-01.fasthacks.cloud
#              WEB_PORT      optional, defaults to 80
# The server needs Docker, usable by DEPLOY_USER without sudo.

name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rust: rustup on the runner reads rust-toolchain.toml and installs that version.
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests
        run: cargo test --locked
        env:
          SQLX_OFFLINE: "true"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Web tests
        run: pnpm test
      - name: Web build (typecheck + bundle)
        run: pnpm build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.vars.outputs.url }}
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'team-01.fasthacks.cloud' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      WEB_PORT: ${{ vars.WEB_PORT || '80' }}
      TAG: ${{ github.sha }}
    steps:
      - name: Check settings
        id: vars
        env:
          DEPLOYMENT_KEY: ${{ secrets.DEPLOYMENT_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          ok=true
          [ -n "$ADMIN_TOKEN" ] || { echo "::error::Add the secret ADMIN_TOKEN. Without it the API falls back to a token that is public in the code."; ok=false; }
          case "$DEPLOYMENT_KEY" in
            *"PRIVATE KEY"*) ;;
            "") echo "::error::Add the secret DEPLOYMENT_KEY (the private SSH key)."; ok=false ;;
            *) echo "::error::DEPLOYMENT_KEY is not a private key. It must start with -----BEGIN OPENSSH PRIVATE KEY----- (the ssh-ed25519 ... line is the public half, which belongs on the server)."; ok=false ;;
          esac
          $ok
          if [ "$WEB_PORT" = 80 ]; then url="http://$DEPLOY_HOST"; else url="http://$DEPLOY_HOST:$WEB_PORT"; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build --target api -t "nullbox-api:$TAG" .
          docker build --target web -t "nullbox-web:$TAG" .

      - name: Set up SSH
        env:
          DEPLOYMENT_KEY: ${{ secrets.DEPLOYMENT_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOYMENT_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's identity, from the organizers' setup script. A different key means
          # we are not talking to our server, and ssh refuses to connect.
          echo "$DEPLOY_HOST,13.115.1.168 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFZTFV60m1I2ugMU4uUdM6qu1ig42HDOEDvdrwnOPDH+" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host server
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          EOF
          ssh server 'docker version --format "Docker {{.Server.Version}} on $(hostname)"' \
            || { echo "::error::Logged in, but could not run docker on the server (not installed, or $DEPLOY_USER is not in the docker group)."; exit 1; }

      - name: Copy images to the server
        run: docker save "nullbox-api:$TAG" "nullbox-web:$TAG" | gzip | ssh server 'gunzip | docker load'

      - name: Write the API settings on the server
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          PUBLIC_URL: ${{ steps.vars.outputs.url }}
        run: |
          printf '%s\n' \
            "ADMIN_TOKEN=$ADMIN_TOKEN" \
            "PUBLIC_WEB_URL=$PUBLIC_URL" \
            "CORS_ALLOWED_ORIGINS=$PUBLIC_URL" \
            | ssh server 'umask 077 && mkdir -p ~/nullbox && cat > ~/nullbox/api.env'

      - name: Start the new version
        run: |
          ssh server bash -s -- "$TAG" "$WEB_PORT" <<'EOF'
          set -euo pipefail
          tag="$1"; port="$2"
          docker network create nullbox >/dev/null 2>&1 || true
          docker volume create nullbox-data >/dev/null
          docker rm -f nullbox-web nullbox-api >/dev/null 2>&1 || true
          docker run -d --name nullbox-api --network nullbox --restart unless-stopped \
            --env-file ~/nullbox/api.env -v nullbox-data:/data "nullbox-api:$tag"
          docker run -d --name nullbox-web --network nullbox --restart unless-stopped \
            -p "$port:80" "nullbox-web:$tag"
          # Wait for the API to answer through the web server.
          for i in $(seq 1 30); do
            if docker exec nullbox-web wget -qO- http://localhost/api/healthz >/dev/null 2>&1; then
              echo "Nullbox $tag is up."
              # Remove images from older deploys.
              docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '^nullbox-(api|web):' \
                | grep -v ":$tag\$" | xargs -r docker rmi >/dev/null 2>&1 || true
              exit 0
            fi
            sleep 2
          done
          echo "The API did not become healthy. Its logs:"
          docker logs --tail 50 nullbox-api
          exit 1
          EOF

      - name: Summary
        run: echo "Deployed ${TAG::7} to ${{ steps.vars.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
